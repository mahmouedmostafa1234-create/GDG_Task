<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up </title>
</head>

<body>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required minlength="3" maxlength="20"><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required autocomplete="email"><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8"><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br>

            <label for="website">Website:</label><br>
            <input type="url" id="website" name="website"><br>

            <label for="birth">Birth Date:</label><br>
            <input type="date" id="birth" name="birth" min="1990-01-01" max="2010-12-31"><br>
        </fieldset>

        <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Preferences</legend>

            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Subscribe to Newsletter</label><br>`

            <label for="country">Country:</label><br>
            <select id="country" name="country">
                <option value="">Select country</option>
                <option value="egypt">Egypt</option>
                <option value="usa">USA</option>
                <option value="uk">Palestine</option>
                <option value="uk">Saudi Arabia</option>
            </select><br><br>

            <label for="language">Favorite Language:</label><br>
            <input list="languages" id="language" name="language">

            <datalist id="languages">
                <option value="HTML">
                <option value="CSS">
                <option value="JavaScript">
                <option value="Python">
                <option value="C++"></option>
            </datalist>

        </fieldset>

        <br>


        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
